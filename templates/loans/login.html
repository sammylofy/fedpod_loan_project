{% extends 'base.html' %}

{% block title %}Login - FEDPOD Cooperative{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-dark text-white py-3 text-center">
                <h4 class="mb-0"><i class="bi bi-shield-lock-fill me-2 text-warning"></i>Cooperative Portal Login</h4>
            </div>
            <div class="card-body p-4">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Username</label>
                        <input type="text" name="username" class="form-control" placeholder="Enter your username" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Password</label>
                        <input type="password" name="password" class="form-control" placeholder="Enter your password" required>
                    </div>
                    <button type="submit" class="btn btn-success w-100 py-2 fw-bold">Sign In</button>
                </form>
                <hr>
                <p class="text-center mb-0 small">
                    New cooperative member? <a href="{% url 'register' %}" class="fw-bold text-success">Register an account</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
